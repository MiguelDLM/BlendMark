schema_version = "1.0.1"

# Manifest for BlendMark Blender extension
# Reference: https://docs.blender.org/manual/en/dev/advanced/extensions/manifest.html

id = "blendmark"
version = "2.0.0"
name = "BlendMark"
tagline = "Landmark and semilandmark digitizing for Geometric Morphometrics"
maintainer = "E. Miguel Diaz de Leon-Munoz"
type = "add-on"

website = "https://github.com/MiguelDLM/BlendMark"

# Categories/tags in Blender Extension Platform
tags = ["3D View", "Mesh", "Import-Export"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-2.0-or-later",
]

copyright = [
  "2024-2026 E. Miguel Diaz de Leon-Munoz",
]

# Declared permissions for Blender 4.2+ extensions
[permissions]
files = "Import and export landmark files (.pts, .csv) to and from disk"

# Build settings for packaging
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/*.zip",
  ".gitignore",
  "README.md",
  "menu.png",
  "example.png",
]